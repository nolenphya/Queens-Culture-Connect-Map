name: Sync Airtable Data

on:
  schedule:
    # Hourly fallback sync just in case
    - cron: '0 * * * *'
  # Listens for real-time dispatch signals from Airtable
  repository_dispatch:
    types: [airtable-update]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Run data fetch script
        env:
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/fetch-data.js

      - name: Commit and push updated JSON data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Real-time sync: Auto-refresh map datasets" && git push)
