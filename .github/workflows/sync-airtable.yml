name: Sync Airtable Data

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  # Allows you to click "Run workflow" manually in GitHub anytime
  workflow_dispatch:
  # Triggers on code pushes
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run data fetch script
        env:
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/fetch-data.js

      - name: Commit and push updated JSON data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update map datasets" && git push)
